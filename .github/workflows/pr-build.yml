name: PR Build

# PR build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  packages: read
  contents: read

env:
  IMAGE_NAME: "httpd-git"
  DOCKERHUB_USERNAME: starwit
  DOCKERHUB_ORG: starwitorg  

jobs:
  checks:
    name: "Package Helm"
    runs-on: [self-hosted, linux, X64]

    steps:
    - name: get helm
      uses: azure/setup-helm@v4

    - name: checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'

    - name: run helm dependency update
      working-directory: helm
      run: helm dep update

    - name: run helm template
      working-directory: helm
      run: helm template .
    
  build_docker:
    name: "Build Docker image"
    runs-on: [self-hosted, linux, X64]

    steps:
      - name: get helm
        uses: azure/setup-helm@v4
        
      - name: "Get version from Helm chart"
        working-directory: helm
        run: |
            helm inspect chart . | grep version | awk -F ' ' '{print $2}'
            VERSION=$(helm inspect chart . | grep version | awk -F ' ' '{print $2}')
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Version: $VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          sbom: true
          provenance: mode=max
          tags: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ github.run_number }}