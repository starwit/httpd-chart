apiVersion: v1
kind: Service
metadata:
  name: {{ include "httpd-git.fullname" . }}
  labels:
    {{- include "httpd-git.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "httpd-git.fullname" . }}
