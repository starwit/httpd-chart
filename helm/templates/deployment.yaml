apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "httpd-git.fullname" . }}
  labels:
    {{- include "httpd-git.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "httpd-git.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "httpd-git.fullname" . }}
    spec:
      containers:
        - name: httpd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: REPO_URL
              value: "{{ .Values.repoUrl }}"
            - name: BRANCH
              value: "{{ .Values.branch }}"
            - name: CRON_SCHEDULE
              value: "{{ .Values.cronSchedule }}"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
